aid: xdemics
name: XDemics
description: 'XDemics Corporation is a Caltech and City of Hope spin-out in San Rafael,
  California that develops High Density Cell Respiration (HDCR) cell-culture hardware
  for biomedical research and biomanufacturing. Its gas-permeable, tissue-mimicking
  Expansify cultureware — a 24-well plate and a single-well plate — and its Profusion
  bioreactor line under development let mammalian cells reach 10-100X higher densities
  than conventional flasks and plates, targeting CAR-T and cell therapy, viral vector
  production, stem cell and regenerative medicine, drug screening, and biologics
  workflows. The company sells physical laboratory consumables and instrumentation,
  distributed through VWR, and its biological testing laboratories sit at the Buck
  Institute in Novato. It is a hardware and life-science company, not a software
  company: it publishes no public API, SDK, developer portal, or machine-readable
  specification of any kind.'
